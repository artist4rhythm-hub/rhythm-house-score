<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123B2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RH 악보">
<title>리듬 하우스 · 악보</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ──────────────────────────────────────────────────────────────
   리듬 하우스 악보 앱 (Rhythm House Score)
   디자인: 좌측 짙은 녹색 레일 · 제목 Cafe24 단정해 · 본문 Cafe24 심플해
   로고 글씨 Cafe24 러빙유 ("Rhythm House"만)
   ────────────────────────────────────────────────────────────── */
@font-face{font-family:'RH Title';src:url('fonts/Cafe24Danjunghae-v2.0.woff2') format('woff2');font-display:swap}
@font-face{font-family:'RH Body';src:url('fonts/Cafe24Simplehae-v2.0.woff2') format('woff2');font-display:swap}
@font-face{font-family:'RH Logo';src:url('fonts/Cafe24Lovingu.ttf') format('truetype');font-display:swap}

:root{
  --g:#123B2A; --g-dark:#0B2619; --g-soft:#E6EFEA; --g-line:#B9CDC2;
  --ink:#15201A; --muted:#5E6A63; --line:#DCE2DE; --line-2:#C9D3CD;
  --bg:#F3F5F3; --paper:#FFFFFF; --danger:#A23B2C;
  --on-g:#FFFFFF; --rail:#123B2A; --hover:#F6F8F7; --line-soft:#EEF1EF; --shelf:#DCE3DE;
  --f-title:'RH Title','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --f-body:'RH Body','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --f-logo:'RH Logo',cursive;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
/* 야간 모드 (모니터 · 패드) — 바탕은 짙은 녹색 검정, 녹색은 밝은 민트로 */
:root[data-theme="dark"]{
  --g:#7FC4A0; --g-dark:#9AD3B5; --g-soft:#1B2A23; --g-line:#9DB8AA;
  --ink:#E2EAE5; --muted:#93A39A; --line:#26342D; --line-2:#33443B;
  --bg:#0E1612; --paper:#16211C; --danger:#E08A7A;
  --on-g:#0E1612; --rail:#0A110D; --hover:#1C2923; --line-soft:#22302A; --shelf:#22302A;
  color-scheme:dark;
}
:root[data-theme="dark"] .paper{filter:invert(.92) hue-rotate(180deg);box-shadow:0 0 0 1px var(--line)}
:root[data-theme="dark"] .errs{background:#2A1A16;border-color:#5A3229;color:#F0C8BE}
:root[data-theme="dark"] #toast{background:#E2EAE5;color:#0E1612}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%;font-synthesis:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--g)}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.t-title{font-family:var(--f-title);font-weight:400;letter-spacing:-.01em}
.wm{font-family:var(--f-logo);line-height:1;white-space:nowrap}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--g)}
.sub{font-size:12.5px;color:var(--muted)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:10px;
  border:1px solid var(--line-2);background:var(--paper);font-size:14.5px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--g);border-color:var(--g);color:var(--on-g)}
.btn.primary:hover{background:var(--g-dark)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{width:44px;height:44px;padding:0}
.chip{border:1px solid var(--line-2);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:var(--on-g)}
.badge{font-size:11px;line-height:1;color:var(--on-g);background:var(--g);border-radius:6px;padding:4px 7px;white-space:nowrap}
.badge.quiet{background:transparent;color:var(--muted);border:1px solid var(--line-2)}
.badge.warn{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.input{height:44px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;background:var(--paper);font-size:15px;color:var(--ink);min-width:0}
.input:focus{outline:2px solid var(--g);outline-offset:0;border-color:var(--g)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;height:44px;background:var(--paper)}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent;font-size:14px}

/* ── 전체 화면 (로그인 · 안내) ─────────────────────── */
.full{min-height:100%;display:flex}
.full .stripe{flex:0 0 14px;background:var(--rail)}
.full .center{flex:1;display:flex;align-items:center;justify-content:center;padding:32px max(20px,var(--sar)) calc(32px + var(--sab)) 20px}
.card{width:100%;max-width:400px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:36px 28px;
  display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.card img.emblem{width:120px;height:126px;object-fit:contain}
.card .wm{font-size:40px;color:var(--g)}
.card .note{font-size:13px;color:var(--muted)}
.card .box{width:100%;text-align:left;background:var(--g-soft);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--ink)}
.card .mail{font-size:15px;word-break:break-all;background:var(--bg);border-radius:8px;padding:8px 12px;width:100%}
.gbtn{width:100%;height:50px;font-size:16px}
.gbtn svg{flex:none}

/* ── 앱 틀 ─────────────────────────────────────── */
#scApp{height:100%;display:flex}
.rail{flex:0 0 76px;background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:calc(20px + var(--sat)) 0 calc(24px + var(--sab));padding-left:var(--sal)}
.rail img{width:44px;height:46px;object-fit:contain;margin-bottom:16px}
.rail .rb{width:52px;height:52px;border-radius:12px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--g-line)}
.rail .rb:hover{background:rgba(255,255,255,.08)}
.rail .rb[aria-current="page"]{background:rgba(255,255,255,.16);color:#fff}
.rail .grow{flex:1}
.rail .ver{font-size:11px;line-height:1.35;color:var(--g-line);text-align:center;margin-bottom:14px;letter-spacing:.03em}
.rail .ver b{display:block;color:#fff;font-size:12.5px;font-weight:400}
.mtop .ver{font-size:11px;color:var(--muted);margin-left:8px}
#upd{position:fixed;left:50%;top:calc(12px + var(--sat));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:12px;
  background:var(--paper);border:1.5px solid var(--g);border-radius:12px;padding:8px 8px 8px 16px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:calc(100% - 24px)}
.rail .vwm{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-logo);font-size:24px;color:#fff;white-space:nowrap}
.body{flex:1;min-width:0;display:flex;flex-direction:column}
.mtop{display:none}
.tabs{display:none}
#main{flex:1;min-height:0;position:relative}

/* ── 악보 화면 (목록 | 보기 | 공유) ───────────────── */
.vScores,.vMembers{height:100%;display:flex}
.list{flex:0 0 360px;background:var(--paper);border-right:1px solid var(--line);overflow:auto;
  padding:calc(28px + var(--sat)) 20px 28px;display:flex;flex-direction:column;gap:16px}
.list h1{margin:0;font-size:30px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.group{display:flex;flex-direction:column;gap:4px}
.group .gh{font-size:12px;letter-spacing:.12em;color:var(--muted);padding:6px 4px 2px}
.books{display:flex;gap:6px;flex-wrap:wrap}
.books .chip b{font-weight:400;opacity:.7;margin-left:6px;font-size:12px}
.part{border-top:1px solid var(--line)}
.part:last-child{border-bottom:1px solid var(--line)}
.ph{display:flex;align-items:center;gap:10px;width:100%;padding:14px 6px;background:none;border:0;text-align:left}
.ph .pn{flex:1;font-family:var(--f-title);font-size:17px}
.ph .pc{font-size:12px;color:var(--muted)}
.ph svg{width:16px;height:16px;flex:none;transition:transform .15s;color:var(--muted)}
.ph[aria-expanded="true"] svg{transform:rotate(90deg)}
.ph:hover{background:var(--hover)}
.pitems{display:flex;flex-direction:column;gap:2px;padding:0 0 12px}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:1.5px solid transparent;background:none;text-align:left;width:100%;font-size:15px}
.row:hover{background:var(--hover)}
.row[aria-current="true"]{background:var(--g-soft);border-color:var(--g)}
.row .rt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rp{font-size:12px;color:var(--muted);white-space:nowrap}
.mpart{border-top:1px solid var(--line)}
.mpart summary{display:flex;align-items:center;gap:10px;padding:12px 4px;cursor:pointer;list-style:none}
.mpart summary::-webkit-details-marker{display:none}
.mpart summary .pn{flex:1;font-family:var(--f-title);font-size:16px}
.mpart summary .pc{font-size:12px;color:var(--muted)}
.mbook{font-size:12px;letter-spacing:.12em;color:var(--muted);padding:14px 4px 4px}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;border:1.5px solid transparent;
  background:transparent;text-align:left;width:100%}
.item:hover{background:var(--hover)}
.item[aria-current="true"]{background:var(--g-soft);border-color:var(--g)}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .k{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .n{font-family:var(--f-title);font-size:18px;line-height:1.3}
.item .d{font-size:12px;color:var(--muted)}
.empty{padding:28px 8px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}

.right{flex:1;min-width:0;display:flex;overflow:hidden}
.viewer{flex:1;min-width:0;display:flex;flex-direction:column;overflow:auto}
.vbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:calc(16px + var(--sat)) 28px 16px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.vbar .tt{flex:1;min-width:160px;display:flex;flex-direction:column;gap:1px}
.vbar .tt .t-title{font-size:22px;line-height:1.25}
.vbar .back{display:none}
.stage{flex:1;padding:28px;display:flex;justify-content:center;align-items:flex-start}
.paper{box-shadow:0 1px 3px rgba(0,0,0,.12),0 10px 30px rgba(18,59,42,.12);background:#fff;overflow:hidden;flex:none}
.scaler{transform-origin:0 0;width:794px}

.share{flex:0 0 340px;background:var(--paper);border-left:1px solid var(--line);overflow:auto;padding:calc(24px + var(--sat)) 22px 24px;display:flex;flex-direction:column;gap:14px}
.share h2{margin:0;font-size:24px}
.checks{display:flex;flex-direction:column}
.check{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line-soft);font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--g);flex:none}
.check .nm{flex:1;min-width:0}
.check .nm small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check .st{font-size:12px;color:var(--muted);white-space:nowrap}
.check .st.on{color:var(--g)}
.sharefoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:4px}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap}
.danger-zone{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}

/* ── 책장 ─────────────────────────────────────── */
.vShelf{height:100%;overflow:auto}
.shelfwrap{padding:calc(28px + var(--sat)) 36px 48px;display:flex;flex-direction:column;gap:22px;max-width:1240px}
.shead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.shead .tx{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px}
.shead h1{margin:0;font-size:30px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;gap:2px;background:var(--paper)}
.seg button{border:0;background:none;border-radius:999px;padding:7px 16px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--g);color:var(--on-g)}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:34px 26px;padding-bottom:6px}
.bk{display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.bk > button.open{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:10px}
.cv{aspect-ratio:3/4;width:100%;border-radius:3px 10px 10px 3px;overflow:hidden;position:relative;background:var(--cv,#123B2A);color:#fff;
  box-shadow:inset 7px 0 0 rgba(0,0,0,.22),inset 8px 0 0 rgba(255,255,255,.08),0 2px 4px rgba(0,0,0,.12),0 14px 26px rgba(10,30,20,.18);transition:transform .15s}
.bk > button.open:hover .cv{transform:translateY(-4px)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv.img::after{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:rgba(0,0,0,.25)}
.cv .d{position:absolute;inset:0;padding:16px 14px 16px 20px;display:flex;flex-direction:column;gap:6px}
.cv .d .wm{font-size:15px;opacity:.85}
.cv .d .ko{margin-top:auto;font-family:var(--f-title);font-size:23px;line-height:1.2;word-break:keep-all}
.cv .d .or{font-size:11px;letter-spacing:.06em;opacity:.8;line-height:1.35}
.cv.light{color:#123B2A}
.bk .ko2{font-family:var(--f-title);font-size:18px;line-height:1.25;word-break:keep-all}
.bk .or2{font-size:12px;color:var(--muted);line-height:1.35}
.bk .cnt{font-size:12px;color:var(--muted)}
.shelfline{height:10px;border-radius:999px;background:var(--shelf);margin-top:-22px}
.arrange{display:flex;gap:6px;flex-wrap:wrap}
.bk .tools{display:flex;gap:6px;flex-wrap:wrap}
.bk .tools .btn{height:34px;padding:0 10px;font-size:12.5px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(8,16,12,.45);display:flex;justify-content:flex-end}
.sheet .in{width:min(440px,100%);height:100%;background:var(--paper);overflow:auto;padding:calc(24px + var(--sat)) 24px calc(24px + var(--sab));display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:24px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line-2)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--g)}
.cvprev{width:150px}

/* ── 책 보기 (펼친 책) ─────────────────────────────── */
.vRead{height:100%;display:flex;flex-direction:column;min-height:0}
.rbar{display:flex;align-items:center;gap:10px;padding:calc(12px + var(--sat)) 20px 12px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.rbar .tt{flex:1;min-width:160px;display:flex;flex-direction:column;gap:1px}
.rbar .tt .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar .tt .t-title{font-size:20px;line-height:1.25}
.rbody{flex:1;min-height:0;display:flex;position:relative}
.toc{flex:0 0 280px;background:var(--paper);border-right:1px solid var(--line);overflow:auto;padding:14px 12px 24px}
.toc .ph{padding:12px 6px}
.toc .ph .pn{font-size:16px}
.spread{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px 20px 16px;touch-action:pan-y}
.pages{display:flex;justify-content:center;flex:1;min-height:0;align-items:center;align-self:stretch;min-width:0}
.pages .paper{box-shadow:0 1px 3px rgba(0,0,0,.12),0 10px 26px rgba(18,59,42,.14)}
.pages.two .paper:first-child{border-radius:3px 0 0 3px;box-shadow:-4px 6px 18px rgba(0,0,0,.12)}
.pages.two .paper:last-child{border-radius:0 3px 3px 0;box-shadow:4px 6px 18px rgba(0,0,0,.12)}
.pages.two .gut{width:2px;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,0));align-self:stretch}
.rnav{display:flex;align-items:center;gap:12px;width:min(720px,100%);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rnav .nb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:var(--paper);display:grid;place-items:center;color:var(--g);flex:none}
.rnav .nb:disabled{opacity:.35}
.rnav input[type=range]{flex:1;accent-color:var(--g);min-width:0}
.rnav .lab{min-width:84px;text-align:center;white-space:nowrap}
.rempty{margin:auto;color:var(--muted)}

/* ── 회원 관리 ─────────────────────────────────── */
.mdetail{flex:1;min-width:0;overflow:auto;padding:calc(28px + var(--sat)) 32px 32px;display:flex;flex-direction:column;gap:18px;max-width:760px}
.mdetail h2{margin:0;font-size:26px}
.addform{display:grid;grid-template-columns:1fr;gap:10px;background:var(--bg);border-radius:12px;padding:14px}
.addform .row{display:flex;gap:8px;flex-wrap:wrap}
.addform .row > *{flex:1 1 140px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-all}

/* ── 악보 등록 ─────────────────────────────────── */
.vAdd,.vMe{height:100%;overflow:auto}
.addwrap{max-width:980px;padding:calc(32px + var(--sat)) 36px 48px;display:flex;flex-direction:column;gap:18px}
.addwrap h1{margin:0;font-size:30px}
textarea.code{width:100%;min-height:220px;border:1px solid var(--line-2);border-radius:12px;padding:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;background:var(--paper);resize:vertical}
.drop{border:2px dashed var(--line-2);border-radius:12px;padding:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--paper)}
.drop.on{border-color:var(--g);background:var(--g-soft)}
.drop .files{font-size:13px;color:var(--muted)}
.errs{background:#FBEFEC;border:1px solid #E7C3BB;color:#6E261B;border-radius:12px;padding:12px 16px;font-size:13.5px}
.errs ul{margin:6px 0 0;padding-left:18px}
.okline{background:var(--g-soft);border-radius:12px;padding:12px 16px;font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.thumb{display:flex;flex-direction:column;gap:8px}
.thumb .cap{display:flex;flex-direction:column;gap:2px}
.thumb .cap b{font-family:var(--f-title);font-weight:400;font-size:16px}
.thumb .cap span{font-size:12px;color:var(--muted)}
.mewrap{max-width:560px;padding:calc(32px + var(--sat)) 36px 48px;display:flex;flex-direction:column;gap:18px}
.mewrap h1{margin:0;font-size:30px}

/* ── 알림 ─────────────────────────────────────── */
#toast{position:fixed;left:50%;bottom:calc(28px + var(--sab));transform:translateX(-50%);background:#15201A;color:#fff;
  padding:12px 18px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

/* ── 넓이별 배치 ───────────────────────────────── */
@media (max-width:1023px){
  .toc{position:absolute;inset:0 auto 0 0;width:300px;z-index:5;box-shadow:8px 0 24px rgba(0,0,0,.2)}
}
@media (max-width:1179px){
  .right{flex-direction:column;overflow:auto}
  .viewer{overflow:visible;flex:none}
  .share{flex:none;border-left:0;border-top:1px solid var(--line);padding-top:24px}
}

// ══════════════════════════════════════════════════════════════
//  리듬 읽기 악보 (위 성부 + 아래 성부, 5줄 또는 1줄)
//  한 마디 = 토큰을 공백으로 구분한 문자열
//    음표 길이: w 온 · h 2분 · q 4분 · e 8분 · s 16분 · t 32분

//  마디에 쓰는 표시 (음표 사이 아무 곳)

//    T3/4 → 이 마디부터 박자 바꿈
//    !p !mf !f … 셈여림 · !< !> 점점 세게/여리게 시작 · !/ 끝 · !cresc !dim !rit 글자 · !fermata 늘임표

const R_TICKS = {w:384, h:192, q:96, e:48, s:24, t:12};

const R_DYN = ['ppp','pp','p','mp','mf','f','ff','fff','fp','sfz','sf','fz'];
function rBarTicks(time){ const [n, d] = R_TIME[time] || [4,4]; return n * 384 / d; }

// 토큰 하나 읽기 → {rest, base, dot, acc, tie, stick, count, grace, roll, inst} 또는 null

// 마디 문자열 → {ev, total, label, box, sim, empty, multi, free, repS, repE, volta, time, tail}
function rParseBar(str, errs, where){

function rEsc(v){ return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// 음표 길이에 따른 가로 간격 (줄 간격 sp 단위)

// 줄에 무엇이 있는지 (위·아래 여백 계산용)
function rLineFeatures(lay, item){

function rSpace(F, stickBelow){

// 한 줄(여러 마디) 그리기
function rDrawLine(item, W, sp, opt){

    return `<text x="${x}" y="${yN}" text-anchor="middle" style="font:900 ${fz}px ${serif}" fill="${k}">${n}</text><text x="${x}" y="${yD}" text-anchor="middle" style="font:900 ${fz}px ${serif}" fill="${k}">${d}</text>`; };

  const repStart = x => `<rect x="${x}" y="${yT}" width="${.45*sp}" height="${yB-yT}" fill="${k}"/><line x1="${x+.9*sp}" x2="${x+.9*sp}" y1="${yT}" y2="${yB}" stroke="${k}" stroke-width=".9"/><circle cx="${x+1.45*sp}" cy="${dotA}" r="${.22*sp}" fill="${k}"/><circle cx="${x+1.45*sp}" cy="${dotB}" r="${.22*sp}" fill="${k}"/>`;

  const half = Math.ceil(shortH.length / 2);
  for(let i = 0; i < half; i++) sumH += Math.max(shortH[i] || 0, shortH[i + half] || 0);
  const rows = half + nLong, avail = 900 - nHead * 34 - rows * 4;
  const spH = avail / Math.max(1, sumH);
  return {sp: Math.max(3.0, Math.min(spW, spH)), lw};
}

function rhythmPageHTML(pg, footer, escf){
  const E = escf || rEsc;
  const W = 794 - 148 - 34;
  const {sp, lw} = rPageScale(pg, W);
  let first = true, body = '', t = pg.time, shortBuf = [], sys = null;
  const opt0 = {bass: pg.bass, staff: pg.staff === 1 ? 1 : 5, stickBelow: pg.stick === 'below'};
  const line = (it, i, showTime, width, time) => {
    const next = pg.items[i+1];
    const final = it.end === true || (it.end !== false && (!next || !!next.h || (!!it.n && !(next && next.sys === 'b'))));
    const r = rDrawLine(it, width, sp, {...opt0, staff: it.staff === 1 ? 1 : it.staff === 5 ? 5 : opt0.staff, time, showTime, final});
    return {html: `<div class="rh-line"><span class="rh-n">${E(it.n || '')}</span>${r.svg}</div>`, endTime: r.endTime};
  };
  const flush = () => {
    if(!shortBuf.length) return;
    const half = Math.ceil(shortBuf.length / 2);
    const col = arr => `<div class="rh-col">${arr.join('')}</div>`;
    body += `<div class="rh-cols" style="flex-grow:${half}">${col(shortBuf.slice(0, half))}${col(shortBuf.slice(half))}</div>`;
    shortBuf = [];
  };
  const nShortAll = pg.items.filter(x => rShort(pg, x)).length;
  pg.items.forEach((it, i) => {
    if(it.h){ flush(); if(sys){ body += sys.join(''); sys = null; }
      body += `<div class="rh-h">${E(it.h)}</div>${it.sub ? `<div class="rh-sub">${E(it.sub)}</div>` : ''}`; first = true; if(it.time) t = it.time; return; }
    const time = it.time || t;
    if(rShort(pg, it)){ const r = line(it, i, shortBuf.length === 0 || shortBuf.length === Math.ceil(nShortAll / 2), lw, time); shortBuf.push(r.html); t = r.endTime; first = false; return; }
    flush();
    const r = line(it, i, first || !!it.time || (it.sys === 'b' && sys && sys.showT), W, time); t = r.endTime;
    if(it.sys === 'a'){ if(sys) body += sys.join(''); sys = [r.html]; sys.showT = first || !!it.time; first = false; return; }
    first = false;
    if(it.sys === 'b' && sys){ body += `<div class="rh-sys">${sys.join('')}${r.html}</div>`; sys = null; return; }
    if(sys){ body += sys.join(''); sys = null; }
    body += r.html;
  });
  if(sys) body += sys.join('');
  flush();
  return `<div class="page pg-rhythm"><div class="rail-wm"><span>Rhythm House</span></div>
    <div class="hd"><div><div class="eye">${E(pg.eye)}</div><div class="ttl">${E(pg.title)}</div></div>${pg.chip ? `<div class="pchip">${E(pg.chip)}</div>` : ''}</div>
    <div class="rh-body">${body}</div>
    <div class="ft"><span><span class="wm">Rhythm House</span>${pg.src ? ' · ' + E(pg.src) : ''}</span><span>${E(footer || '')}</span></div></div>`;
}

// 리듬 페이지 검사
function validateRhythm(o, label){
  const errs = [], time = R_TIME[o.time] ? o.time : (o.time ? null : '4/4');
  if(!time) errs.push(`${label}: 박자(time) "${o.time}" 는 지원하지 않아요 (${Object.keys(R_TIME).join(' · ')})`);
  let curT = time || '4/4';
  if(!Array.isArray(o.items) || !o.items.length){ errs.push(`${label}: 줄(items)이 없어요`); return {errs}; }
  if(o.items.length > 24) errs.push(`${label}: 한 페이지에 줄은 24개까지예요`);
  const items = [];
  const str = (v, n) => String(v).slice(0, n);
  o.items.forEach((it, li) => {
    const w = `${label} ${li+1}번째 줄`;
    if(it && it.h){ const h = {h: str(it.h, 40)}; if(it.sub) h.sub = str(it.sub, 80);
      if(it.time){ if(R_TIME[it.time]){ h.time = it.time; curT = it.time; } else errs.push(`${w}: 박자 "${it.time}" 는 지원하지 않아요`); }
      items.push(h); return; }
    if(!it || !Array.isArray(it.bars) || !it.bars.length || it.bars.length > 10){ errs.push(`${w}: 마디(bars)는 1~10개여야 해요`); return; }
    if(it.time){ if(R_TIME[it.time]) curT = it.time; else errs.push(`${w}: 박자 "${it.time}" 는 지원하지 않아요`); }
    const bars = it.bars.map(b => String(b).trim().replace(/\s+/g, ' '));
    const barTimes = [], skip = [];
    bars.forEach((b, bi) => { const r = rParseBar(b, errs, `${w} ${bi+1}마디`);
      if(r.time) curT = r.time;
      barTimes.push(curT); skip.push(!!(r.sim || r.empty || r.multi || r.free));
      if(r.sim){ if(bi === 0 && !items.some(x => x.bars)) errs.push(`${w} 1마디: 반복(%) 앞에 마디가 없어요`); return; }
      if(r.empty || r.multi || r.free) return;
      const need = rBarTicks(curT);
      if(Math.abs(r.total - need) > 0.5) errs.push(`${w} ${bi+1}마디: 길이가 ${(r.total/96).toFixed(2)}박이에요 (${need/96}박이어야 해요)`); });
    const out = {bars}; if(it.n != null && it.n !== '') out.n = str(it.n, 6);
    if(it.time && R_TIME[it.time]) out.time = it.time;
    if(it.repeat === true) out.repeat = true;
    if(it.dbl === true) out.dbl = true;
    if(it.staff === 1 || it.staff === 5) out.staff = it.staff;
    if(it.end === true || it.end === false) out.end = it.end;
    if(it.sys === 'a' || it.sys === 'b') out.sys = it.sys;
    ['tempo','above','below'].forEach(k => { if(it[k]) out[k] = str(it[k], 40); });
    if(it.bass != null){
      if(!Array.isArray(it.bass) || it.bass.length !== bars.length) errs.push(`${w}: 아래 성부(bass) 마디 수가 위 성부와 달라요`);
      else { out.bass = it.bass.map(b => String(b).trim().replace(/\s+/g, ' '));
        out.bass.forEach((b, bi) => { const r = rParseBar(b, errs, `${w} 아래 ${bi+1}마디`);
          if(r.sim || r.empty || r.multi || r.free || skip[bi]) return;
          if(Math.abs(r.total - rBarTicks(barTimes[bi])) > 0.5) errs.push(`${w} 아래 ${bi+1}마디: 길이가 ${(r.total/96).toFixed(2)}박이에요`); }); }
    }
    items.push(out);
  });
  const res = {errs, items, time: time || '4/4', bass: o.bass === 'beat' ? 'beat' : 'none', cols: o.cols === 2 ? 2 : 1};
  if(o.staff === 1) res.staff = 1;
  if(o.stick === 'below') res.stick = 'below';
  return res;
}

// ── 악보 등록 코드 검사 ─────────────────────────────
const ID_RE = /^[a-z0-9][a-z0-9-]{0,59}$/;
function validateScore(o, i){
  const at = `${i+1}번째 악보`, errs = [];
  if(!o || typeof o !== 'object' || Array.isArray(o)) return {errs:[`${at}: 형식이 올바르지 않아요`]};
  const id = String(o.id || '').trim();
  if(!ID_RE.test(id)) errs.push(`${at}: id는 영문 소문자·숫자·- 로 써 주세요 (예: ld-c1-01)`);
  const title = String(o.title || '').trim();
  if(!title) errs.push(`${at}: 제목(title)이 없어요`);
  const label = title || id || at;
  if(o.kind === 'rhythm'){
    const r = validateRhythm(o, label); errs.push(...r.errs);
    const clean = {id, title, book: String(o.book || '기타').trim(), eye: String(o.eye || '').trim(), chip: String(o.chip || '').trim(), part: String(o.part || '').trim().slice(0, 40),
                   src: String(o.src || '').trim(), order: Number(o.order) || 0, kind: 'rhythm', time: r.time || '4/4', bass: r.bass || 'none', cols: r.cols || 1, items: r.items || []};
    if(r.staff === 1) clean.staff = 1;
    if(r.stick === 'below') clean.stick = 'below';
    return {errs, clean};
  }
  if(!Array.isArray(o.steps) || !o.steps.length){ errs.push(`${label}: 단계(steps)가 없어요`); return {errs}; }
  if(o.steps.length > 6) errs.push(`${label}: 단계는 한 페이지에 6개까지예요`);
  const steps = [];
  o.steps.forEach((st, si) => {
    const w = `${label} ${si+1}단계`;
    if(!st || !Array.isArray(st.beats) || !st.beats.length || st.beats.length > 8){ errs.push(`${w}: 박(beats)은 1~8개여야 해요`); return; }
    const beats = st.beats.map(b => String(b).trim().replace(/\s+/g,' '));
    beats.forEach((b, bi) => {
      const toks = b.split(' ');
      if(![1,2,3,4,6,8].includes(toks.length)) errs.push(`${w} ${bi+1}박: 칸이 ${toks.length}개예요 (1·2·3·4·6·8개만 돼요)`);
      toks.forEach(t => { if(!/^[xstfkp>-]+$/.test(t) || (t !== '-' && !/[xstfkp]/.test(t))) errs.push(`${w} ${bi+1}박: "${t}"는 읽을 수 없는 칸이에요`); });
    });
    const out = {tag: String(st.tag || '').slice(0, 12), beats};
    if(st.stick != null){
      if(!Array.isArray(st.stick) || st.stick.length !== beats.length) errs.push(`${w}: 스티킹(stick) 수가 박 수와 달라요`);
      else {
        const stick = st.stick.map(x => String(x).trim().replace(/\s+/g,' '));
        stick.forEach((x, bi) => {
          const toks = x.split(' ');
          if(toks.length !== beats[bi].split(' ').length) errs.push(`${w} ${bi+1}박: 스티킹 칸 수가 음표 칸 수와 달라요`);
          toks.forEach(t => { if(!/^[RLrl.]$/.test(t)) errs.push(`${w} ${bi+1}박: 스티킹 "${t}"는 R·L·. 만 써요`); });
        });
        out.stick = stick;
      }
    }
    steps.push(out);
  });
  if(!errs.length){
    const total = steps.reduce((a, st) => a + stepGeom(st).H, 0);
    if(total > 900) errs.push(`${label}: 단계가 많아 한 페이지에 다 들어가지 않아요`);
  }
  const clean = {id, title, book: String(o.book || '기타').trim(), eye: String(o.eye || '').trim(), chip: String(o.chip || '').trim(), part: String(o.part || '').trim().slice(0, 40),
                 src: String(o.src || '').trim(), order: Number(o.order) || 0, steps};
  return {errs, clean};
}
function sortScores(list){
  return list.sort((a, b) => (a.book||'').localeCompare(b.book||'', 'ko') || (a.order||0) - (b.order||0) || (a.title||'').localeCompare(b.title||'', 'ko'));
}

function bookTree(list){
  const books = new Map();
  list.forEach(s => { const b = s.book || '기타', p = partOf(s);
    if(!books.has(b)) books.set(b, new Map());
    const parts = books.get(b); if(!parts.has(p)) parts.set(p, []); parts.get(p).push(s); });
  return books;   // 이미 책 · 순서대로 정렬된 목록이라 순서가 그대로 유지됨
}

function resizeCover(file){
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const W = 420, H = 560, c = document.createElement('canvas'); c.width = W; c.height = H;
      const r = Math.max(W / img.width, H / img.height), w = img.width * r, h = img.height * r;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', .82)); };
    img.onerror = () => { URL.revokeObjectURL(url); no(); };
    img.src = url;
  });
}

  const curPart = partOf(pages[S.pi]);
  const parts = new Map(); pages.forEach((pg, i) => { const p = partOf(pg); if(!parts.has(p)) parts.set(p, []); parts.get(p).push([pg, i]); });

          <input type="range" id="rRange" data-act="pgRange" min="1" max="${pages.length}" value="${S.pi + 1}" aria-label="쪽 이동">

function fitReader(){
  const box = document.getElementById('rpages'); if(!box || !S.reading) return;
  const pages = bookPages(S.reading), n = pages.length; if(!n) return;
  const w = box.clientWidth, h = box.clientHeight, byH = h * 794 / 1123;
  const one = Math.min(w, byH), half = Math.min(w / 2 - 1, byH);
  const wasTwo = S.two;
  S.two = n > 1 && w >= 720 && half >= one * .8;
  const vis = visIdx(n), pw = Math.max(120, Math.floor(S.two ? half : one));
  const two = S.two && vis.length === 2;
  box.className = 'pages' + (two ? ' two' : '');
  box.innerHTML = vis.map(i => paperHTML(pages[i], pw)).join(two ? '<span class="gut"></span>' : '');
  const t = $('rTitle'); if(t) t.textContent = [...new Set(vis.map(i => pages[i].title))].join(' · ');
  const lab = $('rLab'); if(lab) lab.textContent = (vis.length === 2 ? `${vis[0] + 1}–${vis[1] + 1}` : `${vis[0] + 1}`) + ` / ${n}`;
  const rg = $('rRange'); if(rg && document.activeElement !== rg) rg.value = S.pi + 1;
  const pv = document.querySelector('[data-act="pgPrev"]'), nx = document.querySelector('[data-act="pgNext"]');
  if(pv) pv.disabled = vis[0] === 0;
  if(nx) nx.disabled = vis[vis.length - 1] >= n - 1;
  vis.forEach(i => markOpened(pages[i].id));
  if(wasTwo !== S.two && tocOpen()) setTimeout(render);   // 목차의 현재 쪽 표시를 맞춤
}
function turn(dir){
  if(!S.reading) return;
  const n = bookPages(S.reading).length, vis = visIdx(n);
  if(dir > 0){ const nx = vis[vis.length - 1] + 1; if(nx >= n) return; S.pi = nx; }
  else { if(vis[0] === 0) return; S.pi = Math.max(0, vis[0] - (S.two ? 2 : 1)); }
  render();
}

function previewAdd(){
  const txt = S.addText.trim();
  if(!txt){ S.addResult = null; render(); return; }
  let data;
  try{ data = JSON.parse(txt); }
  catch(_){ S.addResult = {errs:['코드 형식이 깨졌어요. 처음부터 끝까지 빠짐없이 복사했는지 확인해 주세요.'], items:[]}; render(); return; }
  const arr = Array.isArray(data) ? data : [data];
  const errs = [], items = [], seen = new Set(), bks = [];
  arr.forEach((o, i) => { if(o && o.kind === 'book'){ const r = validateBook(o, i); errs.push(...r.errs); if(r.clean) bks.push(r.clean); return; }
    const r = validateScore(o, i); errs.push(...r.errs); if(r.clean){ if(seen.has(r.clean.id)) errs.push(`id "${r.clean.id}"가 두 번 나와요`); seen.add(r.clean.id); items.push(r.clean); } });
  if(arr.length > 500) errs.push('한 번에 500장까지 등록할 수 있어요');
  S.addResult = {errs, items, books: bks}; render();
}
function validateBook(o, i){
  const at = `${i+1}번째 항목(책)`, errs = [], key = String(o.key || '').trim();
  if(!key || key.length > 60 || /[\/]/.test(key)) errs.push(`${at}: key(책 이름)가 비었거나 너무 길어요`);
  const c = {key, ko: String(o.ko || key).slice(0, 40), orig: String(o.orig || '').slice(0, 120), author: String(o.author || '').slice(0, 60),
             color: /^#[0-9a-fA-F]{6}$/.test(o.color || '') ? o.color : '#123B2A', style: o.style === 'image' ? 'image' : 'design', cover: ''};
  if(o.cover){ if(typeof o.cover === 'string' && /^data:image\/(jpeg|png|webp);base64,/.test(o.cover) && o.cover.length < 650000) c.cover = o.cover; else errs.push(`${at}: 표지 사진이 너무 크거나 형식이 달라요`); }
  if(typeof o.order === 'number') c.order = o.order;
  return {errs, clean: errs.length ? null : c};
}
async function saveAdd(){
  const r = S.addResult; if(!r || r.errs.length || !(r.items.length || (r.books && r.books.length))) return;
  try{
    for(const bk of (r.books || [])){ const {key, ...rest} = bk; await saveBookInfo(key, rest); }
    if(!r.items.length){ toast(`책 ${r.books.length}권의 표지를 저장했어요`); S.addText = ''; S.addResult = null; S.addFiles = []; S.view = 'scores'; S.mode = 'shelf'; render(); return; }
    for(let i = 0; i < r.items.length; i += 400){
      const b = writeBatch(db);
      r.items.slice(i, i + 400).forEach(it => b.set(doc(db, 'scores', it.id), {...it, updatedAt: serverTimestamp()}));
      await b.commit();
    }
    r.items.forEach(it => { const k = scores.findIndex(s => s.id === it.id); if(k >= 0) scores[k] = {...it}; else scores.push({...it}); });
    sortScores(scores);
    toast(`${r.items.length}장을 등록했어요${r.books && r.books.length ? ` · 책 ${r.books.length}권 표지` : ''}`);
    S.cur = r.items[0].id; S.shareFor = null; S.addText = ''; S.addResult = null; S.addFiles = []; S.view = 'scores'; S.mOpen = true; render();
  }catch(e){ toast(errText(e)); }
}
// ── 파일로 올리기 (여러 파일을 하나로 합침)
async function readFiles(list){
  const files = [...list].filter(f => /\.(txt|json)$/i.test(f.name) || /text|json/.test(f.type));
  if(!files.length){ toast('.txt 악보등록코드 파일을 골라 주세요'); return; }
  const all = []; const names = []; const bad = [];
  for(const f of files){
    try{ const txt = await f.text(); const data = JSON.parse(txt.replace(/^\uFEFF/, '')); (Array.isArray(data) ? data : [data]).forEach(x => all.push(x)); names.push(f.name); }
    catch(_){ bad.push(f.name); }
  }
  S.addFiles = names;
  S.addText = all.length ? JSON.stringify(all) : '';
  if(bad.length) toast(`읽지 못한 파일: ${bad.join(', ')}`);
  previewAdd();
}

  part: t => { const k = t.dataset.f, open = t.getAttribute('aria-expanded') === 'true';
    if(open){ S.openParts.delete(k); S.openParts.add('!' + k); } else { S.openParts.add(k); S.openParts.delete('!' + k); } render(); },
  open: t => { S.cur = t.dataset.id; S.mOpen = true; S.delAsk = false; render(); markOpened(S.cur); const v = document.querySelector('.viewer'); if(v) v.scrollTop = 0; },
  back: () => { S.mOpen = false; render(); },
  print: doPrint,
  mode: t => { S.mode = t.dataset.f; lsSet('rh-mode', S.mode); S.reading = null; render(); },
  theme: () => { lsSet('rh-theme', document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); applyTheme(); render(); },
  themeSet: t => { lsSet('rh-theme', t.dataset.f); applyTheme(); render(); },
  readBook: t => { if(S.arrange) return; const k = t.dataset.f; S.reading = k; S.pi = 0; lsSet('rh-book', k); S.book = k; render(); },
  closeBook: () => { S.reading = null; render(); },
  toggleToc: () => { S.toc = !tocOpen(); render(); },
  goPage: t => { S.pi = +t.dataset.i; if(!matchMedia('(min-width:1024px)').matches) S.toc = false; render(); },
  pgPrev: () => turn(-1), pgNext: () => turn(1),
  readPrint,
  readShare: () => { const pg = bookPages(S.reading)[S.pi]; if(!pg) return; S.mode = 'list'; lsSet('rh-mode', 'list'); S.book = S.reading; S.reading = null; S.cur = pg.id; S.mOpen = true; render(); },
  arrange: () => { S.arrange = !S.arrange; render(); },
  moveBook: t => moveBook(t.dataset.f, +t.dataset.d),
  editBook: t => { S.bookEdit = t.dataset.f; S.bd = {...bookInfo(t.dataset.f)}; render(); },
  bookCancel: () => { S.bookEdit = null; S.bd = null; render(); },
  sheetBg: (t, e) => { if(e.target === t){ S.bookEdit = null; S.bd = null; render(); } },
  bkStyle: t => { S.bd.style = t.dataset.f; render(); },
  bkColor: t => { S.bd.color = t.dataset.f; render(); },
  bookSave: async () => { const k = S.bookEdit, d = S.bd; if(!k || !d) return;
    if(d.style === 'image' && !d.cover){ toast('표지 사진을 골라 주세요'); return; }
    try{ await saveBookInfo(k, d); S.bookEdit = null; S.bd = null; toast('표지를 저장했어요'); render(); }catch(e){ toast(errText(e)); } },
  shareAll: () => { members.filter(m => m.role !== 'admin' && m.active !== false).forEach(m => S.shareSel.add(m.email)); render(); },
  shareNone: () => { S.shareSel.clear(); render(); },
  shareSave: saveShares,
  scoreEdit: editScore,
  scoreDel: () => { S.delAsk = true; render(); },
  scoreDelNo: () => { S.delAsk = false; render(); },
  scoreDelYes: deleteScore,
  memPartAll: (t, e) => { e.preventDefault(); const k = t.dataset.f, items = scores.filter(s => (s.book || '기타') + '|' + partOf(s) === k);
    const all = items.every(s => S.memSel.has(s.id)); items.forEach(s => all ? S.memSel.delete(s.id) : S.memSel.add(s.id)); render(); },
  memOpen: t => { S.mOpen = true; loadSharesOf(t.dataset.email); },
  memBack: () => { S.mOpen = false; render(); },
  memSave: saveMemberShares,
  memActive: toggleActive,
  memDel: () => { S.memDelAsk = true; render(); },
  memDelNo: () => { S.memDelAsk = false; render(); },
  memDelYes: deleteMember,
  addPreview: previewAdd,
  addSave: saveAdd,
  addClear: () => { S.addText = ''; S.addResult = null; S.addFiles = []; render(); },
  copyMail: () => copy($('naMail').textContent, '주소를 복사했어요'),
  copyLink: () => copy(location.href, '주소를 복사했어요')
};
function copy(text, msg){
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast(msg), () => toast(text));
  else toast(text);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(!t || t.tagName === 'INPUT' || t.tagName === 'TEXTAREA') return;
  const f = ACT[t.dataset.act]; if(!f) return;
  if(t.tagName === 'A') e.preventDefault();
  f(t, e);
});
let rsT2 = 0;
document.addEventListener('keydown', e => {
  if(S.view !== 'scores' || S.mode !== 'shelf' || !S.reading || S.bookEdit) return;
  const tg = e.target; if(tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.isContentEditable)) return;
  if(e.key === 'ArrowRight' || e.key === 'PageDown'){ e.preventDefault(); turn(1); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); turn(-1); }
});
let swX = null, swY = 0;
document.addEventListener('touchstart', e => { if(!e.target.closest || !e.target.closest('#rpages')){ swX = null; return; } swX = e.touches[0].clientX; swY = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => { if(swX === null) return; const t = e.changedTouches[0], dx = t.clientX - swX, dy = t.clientY - swY; swX = null;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) turn(dx < 0 ? 1 : -1); }, {passive:true});
addEventListener('resize', () => { clearTimeout(rsT2); rsT2 = setTimeout(fitReader, 80); });
document.addEventListener('toggle', e => {
  const d = e.target; if(!d.matches || !d.matches('details.mpart')) return;
  const k = 'm:' + d.dataset.key; d.open ? S.openParts.add(k) : S.openParts.delete(k);
}, true);
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.act === 'addFile' && t.files && t.files.length){ readFiles(t.files); t.value = ''; return; }
  if(t.dataset.act === 'pgRange'){ S.pi = +t.value - 1; render(); return; }
  if(t.dataset.act === 'bkFile' && t.files && t.files[0]){ resizeCover(t.files[0]).then(u => { S.bd.cover = u; S.bd.style = 'image'; render(); }, () => toast('이 사진은 읽을 수 없어요')); t.value = ''; return; }
  if(t.dataset.act === 'shareChk'){ t.checked ? S.shareSel.add(t.dataset.email) : S.shareSel.delete(t.dataset.email); render(); }
  if(t.dataset.act === 'memChk'){ t.checked ? S.memSel.add(t.dataset.id) : S.memSel.delete(t.dataset.id); render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.act === 'addText'){ S.addText = t.value; S.addFiles = []; }
  if(t.dataset.act === 'bkField' && S.bd){ S.bd[t.dataset.f] = t.value; const pv = $('cvPrev'); if(pv) pv.innerHTML = coverHTML(S.bd); return; }
  if(t.dataset.act === 'pgRange'){ S.pi = +t.value - 1; fitReader(); return; }
  if(t.dataset.act === 'listQ'){ S.q = t.value; const pos = t.selectionStart; render(); const n = $('listQ'); if(n){ n.focus(); n.setSelectionRange(pos, pos); } }
  if(t.dataset.act === 'shareQ'){ S.shareQ = t.value; const pos = t.selectionStart; render(); const n = $('shareQ'); if(n){ n.focus(); n.setSelectionRange(pos, pos); } }
});
['dragover','dragenter'].forEach(ev => document.addEventListener(ev, e => { const z = e.target.closest && e.target.closest('#dropZone'); if(!z) return; e.preventDefault(); z.classList.add('on'); }));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => { const z = e.target.closest && e.target.closest('#dropZone'); if(!z) return; e.preventDefault(); z.classList.remove('on'); if(ev === 'drop' && e.dataTransfer && e.dataTransfer.files.length) readFiles(e.dataTransfer.files); }));
// 창 아무 데나 파일을 떨어뜨려도 브라우저가 파일을 열지 않게
['dragover','drop'].forEach(ev => window.addEventListener(ev, e => { if(e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files')) e.preventDefault(); }));
document.addEventListener('submit', e => {
  const f = e.target; if(f.dataset.form !== 'memberAdd') return;
  e.preventDefault(); addMember(f);
});
// 휴대폰에서 회원 상세의 뒤로 버튼 보이기
const mq = matchMedia('(max-width:759px)');
const syncBack = () => document.documentElement.classList.toggle('narrow', mq.matches);
mq.addEventListener ? mq.addEventListener('change', syncBack) : mq.addListener(syncBack); syncBack();

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
<style>
html.narrow .mdetail .back{display:inline-flex!important}
</style>
</body>
